<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Online - Inicio</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Bootstrap Icons (para carrito) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .product-card img {
      height: 180px;
      object-fit: cover;
    }

    .category-menu .list-group-item:hover {
      background-color: #f1f3f5;
    }
  </style>
</head>

<body>

  <div class="container py-4">

    <!-- Encabezado + carrito -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 m-0">Mi Tienda Online</h1>

      <button type="button" class="btn btn-outline-dark position-relative">
        <i class="bi bi-cart3"></i>
        Carrito
        <span id="contadorCarrito"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          0
        </span>
      </button>
    </div>

    <!-- Carousel -->
    <div id="carouselTienda" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="2"></button>
      </div>
      <div class="carousel-inner rounded">
        <div class="carousel-item active">
          <img src="https://picsum.photos/1200/350?random=11" class="d-block w-100" alt="Banner 1">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/350?random=12" class="d-block w-100" alt="Banner 2">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/350?random=13" class="d-block w-100" alt="Banner 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselTienda" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselTienda" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Cuerpo principal -->
    <div class="row">
      <!-- Izquierda: categorías -->
      <aside class="col-sm-3 mb-4">
        <h2 class="h5">Categorías</h2>
        <div class="list-group category-menu">
          <a href="#" class="list-group-item list-group-item-action">Categoría 1</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 2</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 3</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 4</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 5</a>
        </div>
      </aside>

      <!-- Derecha: productos -->
      <section class="col-sm-9">
        <h2 class="h5 mb-3">Productos destacados</h2>
        <div class="row g-3">
          <!-- Producto 1 -->
          <div class="col-12 col-md-4">
            <div class="card product-card h-100">
              <img src="https://picsum.photos/400/250?random=1" class="card-img-top" alt="Producto 1">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Producto 1</h5>
                <button class="btn btn-primary mt-auto agregar-carrito" data-producto="Producto 1">

                  Agregar al carrito

                </button>
              </div>
            </div>
          </div>

          <!-- Producto 2 -->
          <div class="col-12 col-md-4">
            <div class="card product-card h-100">
              <img src="https://picsum.photos/400/250?random=2" class="card-img-top" alt="Producto 2">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Producto 2</h5>
                <button class="btn btn-primary mt-auto agregar-carrito" data-producto="Producto 1">

                  Agregar al carrito

                </button>
              </div>
            </div>
          </div>

          <!-- Producto 3 -->
          <div class="col-12 col-md-4">
            <div class="card product-card h-100">
              <img src="https://picsum.photos/400/250?random=3" class="card-img-top" alt="Producto 3">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Producto 3</h5>
                <button class="btn btn-primary mt-auto agregar-carrito" data-producto="Producto 1">

                  Agregar al carrito

                </button>
              </div>
            </div>
          </div>

          <!-- Producto 4 -->
          <div class="col-12 col-md-4">
            <div class="card product-card h-100">
              <img src="https://picsum.photos/400/250?random=4" class="card-img-top" alt="Producto 4">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Producto 4</h5>
                <button class="btn btn-primary mt-auto agregar-carrito" data-producto="Producto 1">

                  Agregar al carrito

                </button>
              </div>
            </div>
          </div>

          <!-- Producto 5 -->
          <div class="col-12 col-md-4">
            <div class="card product-card h-100">
              <img src="https://picsum.photos/400/250?random=5" class="card-img-top" alt="Producto 5">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Producto 5</h5>
                <button class="btn btn-primary mt-auto agregar-carrito" data-producto="Producto 1">

                  Agregar al carrito

                </button>
              </div>
            </div>
          </div>

          <!-- Producto 6 -->
          <div class="col-12 col-md-4">
            <div class="card product-card h-100">
              <img src="https://picsum.photos/400/250?random=6" class="card-img-top" alt="Producto 6">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Producto 6</h5>
                <button class="btn btn-primary mt-auto agregar-carrito" data-producto="Producto 1">

                  Agregar al carrito

                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

  </div>

  <!-- Footer -->
  <footer class="text-center py-3 mt-4 bg-white border-top">
    Diseñado por: Billy Eduardo cardona Lopez - 1890-20-15738
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
