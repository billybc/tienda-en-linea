<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Online - Inicio</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Bootstrap Icons (para carrito) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

  <div class="container py-4">

    <!-- Encabezado + carrito -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 m-0">Mi Tienda Online</h1>

      <button type="button" class="btn btn-outline-dark position-relative" data-bs-toggle="offcanvas"
        data-bs-target="#carritoOffcanvas" aria-controls="carritoOffcanvas">
        <i class="bi bi-cart3"></i>
        Carrito
        <span id="contadorCarrito"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          0
        </span>
      </button>
    </div>

    <!-- Carousel -->
    <div id="carouselTienda" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselTienda" data-bs-slide-to="2"></button>
      </div>
      <div class="carousel-inner rounded">
        <div class="carousel-item active">
          <img src="https://picsum.photos/1200/350?random=11" class="d-block w-100" alt="Banner 1">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/350?random=12" class="d-block w-100" alt="Banner 2">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/350?random=13" class="d-block w-100" alt="Banner 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselTienda" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselTienda" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Cuerpo principal -->
    <div class="row">
      <!-- Izquierda: categorías -->
      <aside class="col-sm-3 mb-4">
        <h2 class="h5">Categorías</h2>
        <div class="list-group category-menu">
          <a href="#" class="list-group-item list-group-item-action">Categoría 1</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 2</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 3</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 4</a>
          <a href="#" class="list-group-item list-group-item-action">Categoría 5</a>
        </div>
      </aside>

      <!-- Derecha: productos -->
      <section class="col-sm-9">
        <h2 class="h5 mb-3">Productos destacados</h2>
        <!-- Los productos se cargan dinámicamente desde la API -->
        <div id="contenedor-productos" class="row g-3">
          <p class="text-muted">Cargando productos...</p>
        </div>
      </section>
    </div>

  </div>

  <!-- Panel lateral del carrito -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoOffcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="carritoOffcanvasLabel">Tu carrito</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="listaCarrito" class="flex-grow-1">
        <p class="text-muted">Tu carrito está vacío.</p>
      </div>
      <hr>
      <div class="d-flex justify-content-between fw-bold">
        <span>Total:</span>
        <span id="totalCarritoMonto">$0.00</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-3 mt-4">
    Diseñado por: Billy Eduardo Cardona Lopez - 1890-20-15738
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Carga dinámica de productos desde la API -->
  <script>
    const url = "https://backservicetest-g8emcvdff0fqe2b8.canadacentral-01.azurewebsites.net/api/producto";
    const contenedor = document.getElementById("contenedor-productos");
    const contadorCarrito = document.getElementById("contadorCarrito");
    const listaCarrito = document.getElementById("listaCarrito");
    const totalCarritoMonto = document.getElementById("totalCarritoMonto");
    let carrito = [];

    function agregarAlCarrito(producto) {
      const precioFinal = (producto.enOferta && producto.precioOferta != null)
        ? parseFloat(producto.precioOferta)
        : parseFloat(producto.precio);

      carrito.push({
        id: producto.id,
        nombre: producto.nombre,
        precio: precioFinal,
        imagen: producto.imagen
      });

      renderCarrito();
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      renderCarrito();
    }

    function renderCarrito() {
      contadorCarrito.textContent = carrito.length;

      if (carrito.length === 0) {
        listaCarrito.innerHTML = '<p class="text-muted">Tu carrito está vacío.</p>';
        totalCarritoMonto.textContent = "$0.00";
        return;
      }

      let html = "";
      let total = 0;

      carrito.forEach((item, index) => {
        total += item.precio;
        html += `
          <div class="d-flex align-items-center mb-3 border-bottom pb-2">
            <img src="${item.imagen}" alt="${item.nombre}" class="rounded me-2" style="width:50px;height:50px;object-fit:cover;">
            <div class="flex-grow-1">
              <div class="small fw-semibold">${item.nombre}</div>
              <div class="small text-muted">$${item.precio.toFixed(2)}</div>
            </div>
            <button class="btn btn-sm btn-outline-danger eliminar-item" data-index="${index}">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        `;
      });

      listaCarrito.innerHTML = html;
      totalCarritoMonto.textContent = `$${total.toFixed(2)}`;

      listaCarrito.querySelectorAll(".eliminar-item").forEach((boton) => {
        boton.addEventListener("click", (e) => {
          const index = parseInt(e.currentTarget.getAttribute("data-index"));
          eliminarDelCarrito(index);
        });
      });
    }

    async function cargarProductos() {
      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Error HTTP: ${response.status}`);
        }

        const productos = await response.json();

        // Limpiar el mensaje de "Cargando productos..."
        contenedor.innerHTML = "";

        productos.forEach((producto) => {
          const col = document.createElement("div");
          col.className = "col-sm-12 col-md-4 mb-4";

          let precioHTML = "";

          if (producto.enOferta && producto.precioOferta != null) {
            precioHTML = `
              <span class="text-danger fw-bold">$${parseFloat(producto.precioOferta).toFixed(2)}</span>
              <small class="text-muted text-decoration-line-through ms-2">$${parseFloat(producto.precio).toFixed(2)}</small>
            `;
          } else {
            precioHTML = `<span class="fw-bold">$${parseFloat(producto.precio).toFixed(2)}</span>`;
          }

          col.innerHTML = `
            <div class="card product-card h-100">
              <img src="${producto.imagen}" class="card-img-top" alt="${producto.nombre}">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${producto.nombre}</h5>
                <p class="card-text">${producto.descripcion}</p>
                <p class="mb-2">${precioHTML}</p>
                <button class="btn btn-primary mt-auto agregar-carrito">Agregar al carrito</button>
              </div>
            </div>
          `;

          col.querySelector(".agregar-carrito").addEventListener("click", () => {
            agregarAlCarrito(producto);
          });

          contenedor.appendChild(col);
        });

      } catch (error) {
        console.error("Error al cargar productos:", error);
        contenedor.innerHTML = '<div class="alert alert-danger">No se pudieron cargar los productos. Intenta de nuevo más tarde.</div>';
      }
    }

    cargarProductos();
  </script>
</body>

</html>
